<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio — Agnese Barnaba · A/B SiteLab</title>
<meta name="description" content="Tutti i lavori di Agnese Barnaba (A/B SiteLab): siti web reali, concept e redesign. Apri un sito ed esploralo da te.">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/brand/favicon-192.png">
<link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png">
<meta property="og:title" content="Portfolio — Agnese Barnaba · A/B SiteLab">
<meta property="og:description" content="Siti web reali, concept e redesign. Apri un sito ed esploralo da te.">
<meta property="og:image" content="https://agneseb19.github.io/assets/brand/logo-ab-sitelab.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
    /* stesso tema scelto nella home (chiaro/scuro) */
    try { if (localStorage.getItem("ab-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}
    document.documentElement.classList.add("js");
</script>
<style>
    :root {
        --bg: #f8f7f5;
        --bg-2: #efedf1;
        --fg: #242126;
        --muted: #77727c;
        --line: rgba(36, 33, 38, .14);
        --card: #ffffff;
        --pink: #db0750;
        --font: "Bricolage Grotesque", system-ui, sans-serif;
        --mono: "DM Mono", ui-monospace, monospace;
        --pad: 6vw;
    }
    :root[data-theme="dark"] {
        --bg: #131116;
        --bg-2: #1b1820;
        --fg: #f3f1f4;
        --muted: #a39dab;
        --line: rgba(243, 241, 244, .14);
        --card: #1f1c24;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--bg); color: var(--fg); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background .6s, color .6s; }
    ::selection { background: var(--pink); color: #fff; }
    img, video { display: block; max-width: 100%; }
    a { color: inherit; }
    button { font: inherit; color: inherit; }
    :focus:not(:focus-visible) { outline: none; }
    :focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; }
    .skip { position: absolute; left: 16px; top: -60px; z-index: 100; padding: 10px 16px; border-radius: 999px; background: var(--fg); color: var(--bg); text-decoration: none; font: 500 12px/1 var(--mono); }
    .skip:focus { top: 16px; }

    /* ---------- NAV (uguale alla home) ---------- */
    .nav { position: sticky; top: 0; z-index: 30; display: flex; justify-content: space-between; align-items: center; padding: 18px 28px; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid transparent; transition: border-color .4s, background .6s; }
    .nav.scrolled { border-bottom-color: var(--line); }
    .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
    .brand .mark { height: 36px; width: auto; }
    .brand .word { position: relative; display: block; height: 19px; aspect-ratio: 842 / 120; }
    .brand .word::before { content: ""; position: absolute; inset: 0; background: currentColor;
        -webkit-mask: url(../assets/brand/ab-sitelab-scritta-maschera.png) center / 100% 100% no-repeat;
                mask: url(../assets/brand/ab-sitelab-scritta-maschera.png) center / 100% 100% no-repeat; }
    .brand .word img { position: absolute; inset: 0; width: 100%; height: 100%; }
    .nav-right { display: flex; align-items: center; gap: 28px; }
    .nav-right a.link { position: relative; font: 500 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; text-decoration: none; }
    .nav-right a.link::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 1.5px; background: currentColor; transform: scaleX(0); transform-origin: right; transition: transform .4s cubic-bezier(.2,.8,.2,1); }
    .nav-right a.link:hover::after, .nav-right a.link[aria-current]::after { transform: scaleX(1); transform-origin: left; }
    .nav-right a.link[aria-current]::after { background: var(--pink); }
    .btn-contact { display: inline-flex; align-items: center; gap: 10px; padding: 13px 22px; border-radius: 999px; border: 0; background: var(--fg); color: var(--bg); font: 600 14px/1 var(--font); text-decoration: none; cursor: pointer; transition: background .3s, color .3s; }
    .btn-contact span { display: inline-block; transition: transform .35s cubic-bezier(.2,.9,.3,1.4); }
    .btn-contact:hover { background: var(--pink); color: #fff; }
    .btn-contact:hover span { transform: translate(2px, -2px) rotate(-45deg); }

    /* ---------- INTESTAZIONE ---------- */
    .head { padding: 8vh var(--pad) 3vh; }
    .head h1 { margin: 0; font-size: clamp(56px, 8vw, 128px); line-height: .82; letter-spacing: -.06em; font-weight: 780; }
    .head h1 .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .04em; }
    .head h1 .w > span { display: inline-block; transform: translateY(105%); transition: transform 1.4s cubic-bezier(.16,1,.3,1) .1s; }
    .head h1 i { font-style: normal; color: var(--pink); }
    .loaded .head h1 .w > span { transform: none; }
    .head-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 30px; margin-top: 3vh; }
    .head p { margin: 0; max-width: 520px; font-size: clamp(18px, 1.5vw, 24px); line-height: 1.25; letter-spacing: -.02em; }
    .head p span { color: var(--muted); }
    .head small { font: 500 12px/1.6 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: right; }

    /* ---------- FILTRI ---------- */
    .filters { position: sticky; top: 72px; z-index: 20; display: flex; flex-wrap: wrap; gap: 8px; padding: 16px var(--pad); background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: background .6s; }
    .filters button { display: inline-flex; align-items: flex-start; gap: 5px; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font: 500 14px/1 var(--font); letter-spacing: -.01em; cursor: pointer; transition: background .3s, color .3s, border-color .3s; }
    .filters button sup { font: 500 10px/1 var(--mono); color: var(--pink); transition: color .3s; }
    .filters button:hover { border-color: var(--fg); }
    .filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .filters button[aria-pressed="true"] sup { color: inherit; opacity: .7; }

    /* ---------- GRIGLIA DEI LAVORI ---------- */
    .grid { list-style: none; margin: 0; padding: 3vh var(--pad) 12vh; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5vh 2vw; }
    .grid li { transition: opacity .5s, transform .6s cubic-bezier(.16,1,.3,1); }
    .grid li[hidden] { display: none; }
    .work { display: block; text-decoration: none; color: inherit; }
    .js .work { opacity: 0; transform: translateY(50px); transition: opacity 1s, transform 1.2s cubic-bezier(.16,1,.3,1); }
    .js .work.in { opacity: 1; transform: none; }
    .work-media { position: relative; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden; background: var(--bg-2); isolation: isolate; }
    .work-media img, .work-media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; transition: transform 1.2s cubic-bezier(.16,1,.3,1), opacity .5s; }
    .work-media video { opacity: 0; }
    .work.playing .work-media video { opacity: 1; }
    .work:hover .work-media img, .work:hover .work-media video { transform: scale(1.04); }
    .work-media .kind { position: absolute; left: 10px; top: 10px; z-index: 2; padding: 6px 9px; border-radius: 999px; background: rgba(20,18,22,.7); color: #fff; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .work-media .kind.real i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #2bd17e; margin-right: 6px; vertical-align: 1px; }
    .work-media .go { position: absolute; right: 10px; bottom: 10px; z-index: 2; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: var(--pink); color: #fff; font-size: 17px; transform: scale(0) rotate(-45deg); transition: transform .5s cubic-bezier(.2,.9,.3,1.3); }
    .work:hover .work-media .go, .work:focus-visible .work-media .go { transform: scale(1) rotate(0); }
    .work-info { display: grid; grid-template-columns: 30px 1fr auto; gap: 6px 10px; align-items: baseline; padding-top: 14px; }
    .work-info .n { font: 500 11px/1 var(--mono); color: var(--pink); }
    .work-info h2 { margin: 0; font-size: clamp(20px, 1.55vw, 26px); line-height: 1; letter-spacing: -.04em; font-weight: 720; }
    .work-info .cat { grid-column: 2 / 4; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
    .work-info .url { grid-column: 2 / 4; display: inline-flex; gap: 6px; font: 500 11px/1.4 var(--mono); letter-spacing: .02em; color: var(--muted); transition: color .3s; word-break: break-all; }
    .work:hover .work-info .url { color: var(--pink); }
    .work-info .yr { font: 500 11px/1 var(--mono); color: var(--muted); white-space: nowrap; }
    .work-media .kind.official { background: #15803d; color: #fff; }
    .work-media .kind.official i { background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.3); }
    /* "anteprima live": etichetta che compare mentre scorre il video */
    .work-media .live { position: absolute; right: 10px; top: 10px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 999px; background: var(--pink); color: #fff; font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; opacity: 0; transform: translateY(-4px); transition: opacity .3s, transform .4s cubic-bezier(.16,1,.3,1); }
    .work-media .live i { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: blink 1.2s infinite; }
    .work.playing .work-media .live { opacity: 1; transform: none; }
    @keyframes blink { 50% { opacity: .25; } }
    @media (max-width: 1100px) and (min-width: 761px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 5vh 3vw; } }

    /* ---------- FINALE / CONTATTI ---------- */
    .end { padding: 14vh var(--pad) 40px; border-top: 1px solid var(--line); }
    .end .label { margin: 0 0 22px; font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .end .label b { color: var(--pink); font-weight: 500; }
    .end h2 { margin: 0 0 34px; font-size: clamp(56px, 10vw, 170px); line-height: .86; letter-spacing: -.055em; font-weight: 780; }
    .end a.mail { font-size: clamp(22px, 3vw, 46px); letter-spacing: -.03em; font-weight: 650; text-decoration: none; background: linear-gradient(var(--pink), var(--pink)) 0 100% / 0 3px no-repeat; transition: background-size .5s cubic-bezier(.2,.8,.2,1); word-break: break-all; }
    .end a.mail:hover { background-size: 100% 3px; }
    .end .foot { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 12vh; padding-top: 24px; border-top: 1px solid var(--line); font: 500 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
    .end .foot a { text-decoration: none; opacity: .75; }
    .end .foot a:hover { opacity: 1; color: var(--pink); }

    .theme-toggle { position: fixed; right: 16px; bottom: 16px; z-index: 70; padding: 11px 16px; border-radius: 999px; border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 85%, transparent); color: var(--fg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font: 600 13px/1 var(--font); cursor: pointer; transition: background .3s, color .3s; }
    .theme-toggle:hover { background: var(--fg); color: var(--bg); }

    @media (max-width: 760px) {
        :root { --pad: 20px; }
        .nav { padding: 14px 16px; }
        .brand { gap: 7px; }
        .brand .mark { height: 28px; }
        .brand .word { height: 13px; }
        .nav-right { gap: 14px; }
        .nav-right a.link.about { display: none; }
        .btn-contact { padding: 11px 16px; font-size: 13px; }
        .filters { top: 60px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .filters button { flex: 0 0 auto; }
        .head { padding-top: 8vh; }
        .head-row { flex-direction: column; align-items: flex-start; }
        .head small { text-align: left; }
        .grid { grid-template-columns: 1fr; gap: 6vh; }
        .work-info { grid-template-columns: 30px 1fr; }
        .head h1 { font-size: 64px; }
        .work-info .yr { display: none; }
        .work-info .cat, .work-info .url { grid-column: 2; }
        .work-media .go { transform: none; }
        .theme-toggle { width: 46px; height: 46px; padding: 0; font-size: 0; display: grid; place-items: center; }
        .theme-toggle::before { content: "◐"; font-size: 18px; }
        :root[data-theme="dark"] .theme-toggle::before { content: "◑"; }
    }
    @media (prefers-reduced-motion: reduce) {
        .js .work, .head h1 .w > span { transition: none; transform: none; opacity: 1; }
    }
</style>
</head>
<body>
<a class="skip" href="#lavori">Vai ai lavori</a>

<nav class="nav" id="nav">
    <a class="brand" href="../" aria-label="A/B SiteLab — Agnese Barnaba, torna alla home">
        <img class="mark" src="../assets/brand/ab-sitelab-farfalla.png" alt="" width="153" height="120">
        <span class="word"><img src="../assets/brand/ab-sitelab-scritta-rosa.png" alt=""></span>
    </a>
    <div class="nav-right">
        <a class="link" href="./" aria-current="page">Portfolio</a>
        <a class="link about" href="../#about">About</a>
        <a class="btn-contact" href="#contatti">Contattami <span>→</span></a>
    </div>
</nav>

<main id="main">
    <header class="head">
        <h1><span class="w"><span>Portfolio<i>.</i></span></span></h1>
        <div class="head-row">
            <p>Apri un sito. <span>Esploralo da te.</span></p>
            <small id="headCount"></small>
        </div>
    </header>

    <div class="filters" id="filters" role="toolbar" aria-label="Filtra i lavori"></div>

    <ul class="grid" id="lavori"></ul>

    <section class="end" id="contatti">
        <p class="label"><b>→</b> Hai un progetto in mente?</p>
        <h2>Lavoriamo<br>insieme.</h2>
        <a class="mail" href="mailto:agnese.barnaba19@gmail.com">agnese.barnaba19@gmail.com ↗</a>
        <div class="foot">
            <a href="../">← Torna alla home</a>
            <a href="https://www.instagram.com/ab.sitelab/" target="_blank" rel="noopener">Instagram @ab.sitelab ↗</a>
            <a href="https://www.linkedin.com/in/agnese-barnaba-4b5944252/" target="_blank" rel="noopener">LinkedIn ↗</a>
            <a href="https://github.com/agneseb19" target="_blank" rel="noopener">GitHub ↗</a>
            <span style="opacity:.5">© 2026 Agnese Barnaba · A/B SiteLab</span>
        </div>
    </section>
</main>

<button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambia tema">◐ Versione scura</button>

<!-- stessi dati della home: aggiungendo un progetto in assets/data.js compare anche qui -->
<script src="../assets/data.js?v=20261124b"></script>
<script>
(function () {
    const P = window.PROJECTS;
    const pad = n => String(n).padStart(2, "0");
    const $ = id => document.getElementById(id);

    /* ---------- TEMA ---------- */
    const root = document.documentElement, toggle = $("themeToggle");
    const paint = () => { toggle.textContent = root.dataset.theme === "dark" ? "◑ Versione chiara" : "◐ Versione scura"; };
    toggle.addEventListener("click", () => {
        const dark = root.dataset.theme !== "dark";
        if (dark) root.dataset.theme = "dark"; else delete root.dataset.theme;
        try { localStorage.setItem("ab-theme", dark ? "dark" : "light"); } catch (e) {}
        paint();
    });
    paint();

    /* ---------- CATEGORIE (dal "type" di ogni progetto) ---------- */
    const catOf = p => /REALE/.test(p.type) ? "reali" : /REDESIGN/.test(p.type) ? "redesign" : "concept";
    const CATS = [["tutti", "Tutti"], ["reali", "Progetti reali"], ["concept", "Concept"], ["redesign", "Redesign"]];
    const KIND = { reali: "Progetto reale", concept: "Concept", redesign: "Redesign" };
    const count = c => c === "tutti" ? P.length : P.filter(p => catOf(p) === c).length;

    $("headCount").innerHTML = pad(P.length) + " progetti<br>Ogni sito si apre in una nuova scheda";

    $("filters").innerHTML = CATS.filter(c => count(c[0])).map((c, i) =>
        '<button type="button" data-cat="' + c[0] + '" aria-pressed="' + (i === 0) + '">' + c[1] + "<sup>" + count(c[0]) + "</sup></button>").join("");

    /* ---------- LAVORI ---------- */
    const stateOf = p => /ONLINE A BREVE/.test(p.type) ? "A breve online" : /sviluppo|in corso/i.test(p.status) ? "In sviluppo" : "Online";
    const official = p => /SITO UFFICIALE/.test(p.type);
    const clean = u => u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "").split("?")[0];
    $("lavori").innerHTML = P.map((p, i) => {
        const live = p.links[0];
        const c = catOf(p);
        const media =
            '<div class="work-media">' +
            '<img src="../' + p.poster + '" alt="Anteprima del sito ' + p.name + '" loading="' + (i < 2 ? "eager" : "lazy") + '" width="1600" height="1000">' +
            '<video muted loop playsinline preload="none" data-src="../' + p.video + '"></video>' +
            (official(p) ? '<span class="kind reali official"><i></i>Sito ufficiale · online</span>'
                         : '<span class="kind ' + c + '">' + (c === "reali" ? "<i></i>" : "") + KIND[c] + "</span>") +
            '<span class="live" aria-hidden="true"><i></i>Anteprima live</span>' +
            '<span class="go" aria-hidden="true">↗</span></div>';
        const info =
            '<div class="work-info"><span class="n">' + pad(i + 1) + "</span><h2>" + p.name + '</h2><span class="yr">' + stateOf(p) + "</span>" +
            '<p class="cat">' + p.short + "</p>" +
            (live ? '<span class="url">' + clean(live.href) + " <span>↗</span></span>" : "") + "</div>";
        const inner = media + info;
        return '<li data-cat="' + c + '">' + (live
            ? '<a class="work" data-id="' + p.id + '" href="' + live.href + '" target="_blank" rel="noopener" aria-label="' + p.name + ' — apri il sito in una nuova scheda">' + inner + "</a>"
            : '<div class="work" data-id="' + p.id + '">' + inner + "</div>") + "</li>";
    }).join("");

    /* entrata morbida delle card */
    const works = Array.from(document.querySelectorAll(".work"));
    const io = new IntersectionObserver(es => es.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
    }), { threshold: .15 });
    works.forEach((w, i) => { w.style.transitionDelay = (i % 2) * .08 + "s"; io.observe(w); });

    /* anteprima live: al passaggio del mouse (computer) parte la registrazione del sito.
       START = secondo da cui far partire ogni video, saltando i primi istanti fermi */
    const START = { brace: 1.4, vesper: 0, oblo: 3.1, velaria: 3.4, "rama-piscine": 2.2, obsidia: 2.4, josmash: 1, "new-connection": 2.4, creationweb: .7, ecomedica: .7 };
    const hover = matchMedia("(hover: hover)").matches;
    const load = (w, v) => {
        if (v.src) return;
        v.preload = "auto"; v.src = v.dataset.src;
        const t = START[w.dataset.id] || 0;
        v.loop = false;
        v.addEventListener("loadedmetadata", () => { v.currentTime = t; }, { once: true });
        v.addEventListener("ended", () => { v.currentTime = t; v.play().catch(() => {}); });
    };
    /* i video si caricano quando la card entra nello schermo, così al passaggio del mouse partono subito */
    const pio = new IntersectionObserver(es => es.forEach(e => {
        if (e.isIntersecting) { load(e.target, e.target.querySelector("video")); pio.unobserve(e.target); }
    }), { rootMargin: "200px 0px" });
    works.forEach(w => pio.observe(w));
    works.forEach(w => {
        const v = w.querySelector("video");
        const play = () => {
            load(w, v);
            v.play().then(() => w.classList.add("playing")).catch(() => {});
        };
        const stop = () => { w.classList.remove("playing"); v.pause(); };
        if (hover) {
            w.addEventListener("mouseenter", play);
            w.addEventListener("mouseleave", stop);
            w.addEventListener("focus", play);
            w.addEventListener("blur", stop);
        }
    });

    /* su telefono: parte il video della card che è al centro dello schermo */
    if (!hover) {
        const vio = new IntersectionObserver(es => es.forEach(e => {
            const v = e.target.querySelector("video");
            if (e.isIntersecting) {
                load(e.target, v);
                v.play().then(() => e.target.classList.add("playing")).catch(() => {});
            } else { e.target.classList.remove("playing"); v.pause(); }
        }), { rootMargin: "-35% 0px -35% 0px" });
        works.forEach(w => vio.observe(w));
    }

    /* ---------- FILTRI ---------- */
    const btns = Array.from($("filters").children);
    btns.forEach(b => b.addEventListener("click", () => {
        btns.forEach(x => x.setAttribute("aria-pressed", x === b));
        const cat = b.dataset.cat;
        document.querySelectorAll("#lavori li").forEach(li => {
            li.hidden = !(cat === "tutti" || li.dataset.cat === cat);
            const w = li.firstElementChild;
            if (!li.hidden) { w.classList.remove("in"); requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add("in"))); }
        });
    }));

    /* ---------- NAV ---------- */
    addEventListener("scroll", () => $("nav").classList.toggle("scrolled", scrollY > 10), { passive: true });
    requestAnimationFrame(() => root.classList.add("loaded"));
})();
</script>
</body>
</html>
