<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo 04 — Scroll cinematografico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo.css">
<style>
    html.lenis, html.lenis body { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto !important; }

    /* ---------- 1. Il progetto si espande ---------- */
    .expand {
        position: relative;
        height: 100vh;
        overflow: hidden;
    }

    .expand-word {
        position: absolute;
        left: 0; right: 0;
        margin: 0;
        text-align: center;
        font-size: clamp(54px, 12vw, 200px);
        font-weight: 800;
        line-height: .85;
        letter-spacing: -.055em;
        z-index: 2;
        will-change: transform;
    }

    .expand-word.top { top: 9vh; }
    .expand-word.bottom { bottom: 8vh; font-weight: 250; color: var(--pink); }

    .expand-media {
        position: absolute;
        inset: 0;
        z-index: 1;
        clip-path: inset(31% 32% 31% 32% round 22px);
        will-change: clip-path;
    }

    .expand-media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
        transform: scale(1.35);
    }

    .expand-shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(20,18,22,.75), transparent 50%);
        opacity: 0;
    }

    .expand-caption {
        position: absolute;
        left: 24px; right: 24px; bottom: 28px;
        z-index: 3;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        color: #fff;
        opacity: 0;
    }

    .expand-caption h2 { margin: 0; font-size: clamp(40px, 7vw, 110px); line-height: .9; letter-spacing: -.04em; }
    .expand-caption span { font: 500 12px/1.5 var(--mono); text-transform: uppercase; letter-spacing: .06em; }

    .scroll-cue {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        z-index: 3;
        font: 500 11px/1 var(--mono);
        letter-spacing: .08em;
        text-transform: uppercase;
        color: #fff;
        background: var(--ink);
        padding: 10px 14px;
        border-radius: 999px;
    }

    /* ---------- 2. Galleria orizzontale ---------- */
    .horizontal {
        height: 100vh;
        overflow: hidden;
        background: var(--ink);
        color: var(--paper);
        display: flex;
        align-items: center;
    }

    .h-track {
        display: flex;
        gap: 3vw;
        padding: 0 6vw;
        will-change: transform;
    }

    .h-intro {
        flex: 0 0 auto;
        width: 34vw;
        min-width: 280px;
        align-self: center;
    }

    .h-intro h2 { margin: 0 0 18px; font-size: clamp(44px, 6vw, 96px); line-height: .9; letter-spacing: -.045em; }
    .h-intro p { margin: 0; color: rgba(248,247,245,.6); font-size: 17px; line-height: 1.5; max-width: 360px; }

    .h-card {
        flex: 0 0 auto;
        width: 46vw;
        min-width: 300px;
        margin: 0;
    }

    .h-card .frame {
        aspect-ratio: 16 / 10;
        border-radius: 18px;
        overflow: hidden;
        background: #333;
    }

    .h-card img {
        width: 120%;
        height: 100%;
        object-fit: cover;
        object-position: top;
        will-change: transform;
    }

    .h-card figcaption {
        display: flex;
        justify-content: space-between;
        padding-top: 16px;
        font-size: 24px;
        font-weight: 650;
        letter-spacing: -.02em;
    }

    .h-card figcaption small { font: 500 12px/2 var(--mono); text-transform: uppercase; color: rgba(248,247,245,.55); }
    .h-card figcaption b { color: var(--pink); font-weight: 400; margin-right: 10px; font-family: var(--mono); font-size: 14px; }

    /* ---------- 3. Fine ---------- */
    .outro {
        height: 80vh;
        display: grid;
        place-items: center;
        text-align: center;
    }

    .outro h2 { font-size: clamp(48px, 10vw, 160px); letter-spacing: -.05em; line-height: .9; margin: 0 0 24px; }
    .outro h2 em { font-style: normal; color: var(--pink); font-weight: 300; }

    @media (max-width: 700px) {
        .expand-media { clip-path: inset(30% 14% 30% 14% round 18px); }
        .h-card { width: 78vw; }
        .h-intro { width: 70vw; }
    }
</style>
</head>
<body>

<div class="demo-bar">
    <a class="demo-back" href="index.html">← Tutte le demo</a>
    <span class="demo-tag"><b>04</b> · Scroll cinematografico</span>
</div>

<section class="expand" id="expand">
    <h1 class="expand-word top" id="wTop">Selected</h1>
    <div class="expand-media" id="media"><img src="../images/josmash.jpg" alt="JoSmash"><div class="expand-shade" id="shade"></div></div>
    <span class="scroll-cue" id="cue">Scorri ↓</span>
    <div class="expand-caption" id="caption">
        <h2>JoSmash</h2>
        <span>01 — Redesign · GSAP<br>Apri il progetto ↗</span>
    </div>
    <p class="expand-word bottom" id="wBottom">work</p>
</section>

<section class="horizontal" id="horizontal">
    <div class="h-track" id="track">
        <div class="h-intro">
            <h2>Altri<br>progetti.</h2>
            <p>Scorrendo in verticale la galleria si muove in orizzontale, e gli screenshot hanno una leggera parallasse.</p>
        </div>
    </div>
</section>

<section class="outro">
    <div>
        <h2>Parliamo del<br><em>prossimo</em> progetto.</h2>
        <a class="btn" href="index.html">← Torna alle demo</a>
    </div>
</section>

<script src="../josmash-redesign/assets/vendor/gsap.min.js"></script>
<script src="../josmash-redesign/assets/vendor/ScrollTrigger.min.js"></script>
<script src="../josmash-redesign/assets/vendor/lenis.min.js"></script>
<script src="shared.js"></script>
<script>
(function () {
    const track = document.getElementById("track");
    PROJECTS.slice(1).forEach(function (p, i) {
        const f = document.createElement("figure");
        f.className = "h-card";
        f.innerHTML = '<div class="frame"><img src="' + p.src + '" alt="' + p.name + '"></div>' +
            '<figcaption><span><b>' + String(i + 2).padStart(2, "0") + '</b>' + p.name + '</span><small>' + p.tag + '</small></figcaption>';
        track.appendChild(f);
    });

    gsap.registerPlugin(ScrollTrigger);

    /* Smooth scroll */
    if (!REDUCED_MOTION) {
        const lenis = new Lenis({ lerp: .09, smoothWheel: true });
        lenis.on("scroll", ScrollTrigger.update);
        gsap.ticker.add(function (t) { lenis.raf(t * 1000); });
        gsap.ticker.lagSmoothing(0);
    }

    /* 1. Il primo progetto si espande a tutto schermo */
    const startClip = innerWidth < 700 ? "inset(30% 14% 30% 14% round 18px)" : "inset(31% 32% 31% 32% round 22px)";
    const tl = gsap.timeline({
        defaults: { ease: "none" },
        scrollTrigger: { trigger: "#expand", start: "top top", end: "+=180%", pin: true, scrub: true }
    });

    tl.to("#cue", { opacity: 0, duration: .1 }, 0)
      .fromTo("#media", { clipPath: startClip }, { clipPath: "inset(0% 0% 0% 0% round 0px)", duration: 1, ease: "power2.inOut" }, 0)
      .to("#media img", { scale: 1, duration: 1, ease: "power2.inOut" }, 0)
      .to("#wTop", { yPercent: -160, opacity: 0, duration: .7, ease: "power2.in" }, 0)
      .to("#wBottom", { yPercent: 160, opacity: 0, duration: .7, ease: "power2.in" }, 0)
      .to("#shade", { opacity: 1, duration: .3 }, .8)
      .fromTo("#caption", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .3 }, .85)
      .to({}, { duration: .35 });

    /* 2. Galleria orizzontale */
    const distance = function () { return track.scrollWidth - innerWidth; };
    const hTween = gsap.to(track, {
        x: function () { return -distance(); },
        ease: "none",
        scrollTrigger: {
            trigger: "#horizontal",
            start: "top top",
            end: function () { return "+=" + distance(); },
            pin: true,
            scrub: true,
            invalidateOnRefresh: true
        }
    });

    /* Parallasse delle immagini dentro le card */
    gsap.utils.toArray(".h-card img").forEach(function (img) {
        gsap.fromTo(img, { xPercent: -16 }, {
            xPercent: 0,
            ease: "none",
            scrollTrigger: {
                trigger: img.closest(".h-card"),
                containerAnimation: hTween,
                start: "left right",
                end: "right left",
                scrub: true
            }
        });
    });

    addEventListener("load", function () { ScrollTrigger.refresh(); });
})();
</script>
</body>
</html>
