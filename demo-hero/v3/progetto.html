<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progetto — Agnese Barnaba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="v3.css">
<style>
    body { background: var(--bg); color: var(--fg); }

    .wrap { max-width: 1320px; margin: 0 auto; padding: 0 28px; }

    /* ---------- BARRA IN ALTO ---------- */
    .top {
        position: fixed;
        inset: 0 0 auto;
        z-index: 50;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 18px 28px;
        font: 500 12px/1 var(--mono);
        letter-spacing: .06em;
        text-transform: uppercase;
        background: linear-gradient(var(--bg) 30%, transparent);
    }

    .top a { color: inherit; text-decoration: none; }
    .top a:hover { color: var(--accent); }
    .top .mid { color: var(--muted); }
    .top .right { justify-self: end; }

    .progress {
        position: fixed;
        left: 0; top: 0;
        z-index: 60;
        height: 2px;
        width: 100%;
        background: var(--accent);
        transform-origin: left;
        transform: scaleX(0);
    }

    /* ---------- INTRO ---------- */
    .intro { padding: 150px 0 70px; }

    .eyebrow {
        display: flex;
        gap: 14px;
        margin: 0 0 28px;
        font: 500 12px/1 var(--mono);
        letter-spacing: .06em;
        text-transform: uppercase;
        color: var(--muted);
    }

    .eyebrow b { color: var(--accent); font-weight: 500; }

    .title {
        margin: 0 0 46px;
        font-size: clamp(56px, 11vw, 176px);
        line-height: .88;
        letter-spacing: -.055em;
        font-weight: 750;
    }

    .title .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .06em; margin-bottom: -.06em; }
    .title .w > span { display: inline-block; }

    .intro-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 30px;
        align-items: end;
        padding-top: 26px;
        border-top: 1px solid var(--line);
    }

    .lead { margin: 0; max-width: 520px; font-size: clamp(19px, 1.7vw, 24px); line-height: 1.35; letter-spacing: -.01em; }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 22px;
        border-radius: 999px;
        border: 1px solid var(--line-strong);
        color: inherit;
        text-decoration: none;
        font: 600 15px/1 var(--font);
        transition: background .3s, color .3s, border-color .3s;
    }

    .pill.solid { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .pill:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .pill.off { opacity: .5; pointer-events: none; }

    /* ---------- VIDEO PRINCIPALE ---------- */
    .stage { padding: 10px 0 30px; }

    .browser {
        position: relative;
        border-radius: 16px;
        overflow: hidden;
        background: #1c1a1f;
        box-shadow: 0 60px 120px -50px rgba(0,0,0,.9), 0 0 0 1px var(--line);
        will-change: transform;
    }

    .browser-bar {
        display: grid;
        grid-template-columns: 70px 1fr 70px;
        align-items: center;
        height: 40px;
        padding: 0 14px;
        background: #232026;
        border-bottom: 1px solid var(--line);
    }

    .dots { display: flex; gap: 7px; }
    .dots i { width: 11px; height: 11px; border-radius: 50%; background: #3a363e; }

    .url {
        justify-self: center;
        max-width: 100%;
        padding: 6px 16px;
        border-radius: 8px;
        background: #2c2930;
        font: 500 12px/1 var(--mono);
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .live {
        justify-self: end;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: 500 10px/1 var(--mono);
        letter-spacing: .08em;
        color: var(--muted);
    }

    .live i { width: 7px; height: 7px; border-radius: 50%; background: #2bd17e; box-shadow: 0 0 10px #2bd17e; animation: blink 1.6s infinite; }
    .live.static i { background: #f2b33d; box-shadow: 0 0 10px #f2b33d; }

    @keyframes blink { 50% { opacity: .35; } }

    .screen { position: relative; aspect-ratio: 16 / 10; background: #000; overflow: hidden; }
    .screen video, .screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .screen img.kb { animation: kenburns 18s ease-in-out infinite alternate; }

    @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.12) translateY(-3%); } }

    .caption {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-top: 16px;
        font: 500 12px/1.5 var(--mono);
        letter-spacing: .04em;
        text-transform: uppercase;
        color: var(--muted);
    }

    /* ---------- DATI ---------- */
    .facts {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 28px;
        padding: 110px 0;
    }

    .fact { border-top: 1px solid var(--line); padding-top: 18px; }
    .fact h3 { margin: 0 0 14px; font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .fact p { margin: 0; font-size: 18px; line-height: 1.4; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tags span { padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.06); font: 500 11px/1 var(--mono); letter-spacing: .04em; }

    /* ---------- TESTO ---------- */
    .about {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 40px;
        padding: 40px 0 140px;
    }

    .about h2 {
        position: sticky;
        top: 110px;
        align-self: start;
        margin: 0;
        font: 500 12px/1 var(--mono);
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--muted);
    }

    .about-text p { margin: 0 0 28px; font-size: clamp(22px, 2.3vw, 34px); line-height: 1.28; letter-spacing: -.02em; }
    .about-text p.quote { color: var(--accent); font-style: italic; }

    /* ---------- DESKTOP E MOBILE ---------- */
    .devices { padding: 0 0 150px; }

    .devices-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 40px; }
    .devices-head h2 { margin: 0; font-size: clamp(38px, 5vw, 76px); letter-spacing: -.045em; line-height: .92; font-weight: 700; }
    .devices-head p { margin: 0; max-width: 340px; color: var(--muted); line-height: 1.5; }

    .devices-grid {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 40px;
        align-items: center;
        padding: 60px;
        border-radius: 28px;
        background: radial-gradient(70% 90% at 80% 100%, rgba(255,46,110,.22), transparent 70%), #151317;
        overflow: hidden;
    }

    .phone {
        position: relative;
        aspect-ratio: 390 / 844;
        border-radius: 46px;
        padding: 11px;
        background: #222025;
        box-shadow: 0 40px 80px -30px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,.08);
        will-change: transform;
    }

    .phone .screen { aspect-ratio: auto; height: 100%; border-radius: 36px; }
    .phone::before {
        content: ""; position: absolute; z-index: 2; top: 20px; left: 50%; transform: translateX(-50%);
        width: 90px; height: 24px; border-radius: 20px; background: #000;
    }

    /* ---------- PROSSIMO PROGETTO ---------- */
    .next {
        display: block;
        padding: 0 0 80px;
        color: inherit;
        text-decoration: none;
    }

    .next-label { display: flex; justify-content: space-between; padding-top: 22px; border-top: 1px solid var(--line); font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

    .next-name {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin: 26px 0 34px;
        font-size: clamp(56px, 10vw, 160px);
        line-height: .9;
        letter-spacing: -.055em;
        font-weight: 750;
    }

    .next-name span:last-child { font-weight: 250; transition: transform .5s cubic-bezier(.2,.8,.2,1), color .3s; }
    .next:hover .next-name span:last-child { transform: translateX(16px); color: var(--accent); }

    .next-media { border-radius: 20px; overflow: hidden; aspect-ratio: 21 / 9; background: #000; }
    .next-media video, .next-media img { width: 100%; height: 100%; object-fit: cover; object-position: top; transition: transform 1s cubic-bezier(.2,.8,.2,1); }
    .next:hover .next-media video, .next:hover .next-media img { transform: scale(1.04); }

    /* comparsa allo scroll (gestita da GSAP; senza JS resta visibile) */
    .js .reveal { opacity: 0; transform: translateY(40px); }

    @media (max-width: 860px) {
        .top { grid-template-columns: 1fr auto; padding: 16px; }
        .top .mid { display: none; }
        .wrap { padding: 0 16px; }
        .intro { padding-top: 110px; }
        .intro-row { grid-template-columns: 1fr; }
        .facts { grid-template-columns: 1fr 1fr; padding: 70px 0; }
        .about { grid-template-columns: 1fr; padding-bottom: 90px; }
        .about h2 { position: static; }
        .devices-head { flex-direction: column; align-items: start; }
        .devices-grid { grid-template-columns: 1fr; padding: 24px; }
        .phone { width: 64%; margin: 0 auto; }
        .browser-bar { grid-template-columns: 50px 1fr 50px; }
    }
</style>
</head>
<body>
<script>document.documentElement.classList.add("js");</script>

<div class="curtain" id="curtain"></div>
<div class="progress" id="progress"></div>

<header class="top">
    <a href="#" id="back">← Agnese Barnaba</a>
    <span class="mid" id="count"></span>
    <a class="right" href="#" id="nextTop"></a>
</header>

<main>
    <section class="intro wrap">
        <p class="eyebrow" id="eyebrow"></p>
        <h1 class="title" id="title"></h1>
        <div class="intro-row reveal">
            <p class="lead" id="lead"></p>
            <div class="actions" id="actions"></div>
        </div>
    </section>

    <section class="stage wrap">
        <div class="browser" id="browser">
            <div class="browser-bar"><span class="dots"><i></i><i></i><i></i></span><span class="url" id="url"></span><span class="live" id="live"><i></i><em id="liveText">LIVE</em></span></div>
            <div class="screen" id="screen"></div>
        </div>
        <p class="caption"><span id="capLeft"></span><span id="capRight"></span></p>
    </section>

    <section class="facts wrap" id="facts"></section>

    <section class="about wrap">
        <h2>Il progetto</h2>
        <div class="about-text" id="about"></div>
    </section>

    <section class="devices wrap">
        <div class="devices-head reveal">
            <h2>Desktop<br>e mobile.</h2>
            <p>Ogni progetto è responsive: layout, interazioni e animazioni sono pensati anche per lo schermo del telefono.</p>
        </div>
        <div class="devices-grid">
            <div class="browser" id="browserSmall">
                <div class="browser-bar"><span class="dots"><i></i><i></i><i></i></span><span class="url" id="url2"></span><span></span></div>
                <div class="screen" id="screen2"></div>
            </div>
            <div class="phone" id="phone"><div class="screen" id="screenMobile"></div></div>
        </div>
    </section>

    <a class="next wrap" id="next">
        <div class="next-label"><span>Prossimo progetto</span><span id="nextCount"></span></div>
        <div class="next-name"><span id="nextName"></span><span>→</span></div>
        <div class="next-media" id="nextMedia"></div>
    </a>
</main>

<script src="data.js"></script>
<script src="../../josmash-redesign/assets/vendor/gsap.min.js"></script>
<script src="../../josmash-redesign/assets/vendor/ScrollTrigger.min.js"></script>
<script src="../../josmash-redesign/assets/vendor/lenis.min.js"></script>
<script>
(function () {
    const P = window.PROJECTS;
    const q = new URLSearchParams(location.search);
    let i = Math.max(0, P.findIndex(function (p) { return p.id === q.get("p"); }));
    const p = P[i], next = P[(i + 1) % P.length];
    const from = q.get("from") || "a-volo.html";
    const pad = function (n) { return String(n).padStart(2, "0"); };
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const $ = function (id) { return document.getElementById(id); };

    document.title = p.name + " — Agnese Barnaba";

    /* ---------- CONTENUTI ---------- */
    $("back").href = from;
    $("count").textContent = "Progetto " + pad(i + 1) + " / " + pad(P.length);
    $("nextTop").textContent = "Prossimo: " + next.name + " →";
    $("nextTop").href = $("next").href = "progetto.html?p=" + next.id + "&from=" + encodeURIComponent(from);

    $("eyebrow").innerHTML = "<b>" + pad(i + 1) + "</b><span>" + p.type + "</span>";
    $("title").innerHTML = p.name.split(" ").map(function (w) { return '<span class="w"><span>' + w + "</span></span>"; }).join(" ");
    $("lead").textContent = p.short + ".";

    $("actions").innerHTML = p.links.map(function (l, k) {
        return '<a class="pill' + (k === 0 ? " solid" : "") + '" href="' + l.href + '" target="_blank" rel="noopener">' + l.label.replace(" ↗", "") + " <span>↗</span></a>";
    }).join("") || '<span class="pill off">' + p.status + "</span>";

    /* media: video registrato dal sito vero, oppure screenshot animato */
    function media(el, src, poster, fallback) {
        if (src) {
            el.innerHTML = '<video muted loop playsinline preload="metadata" poster="' + poster + '" src="' + src + '"></video>';
        } else {
            el.innerHTML = '<img class="kb" src="' + fallback + '" alt="">';
        }
    }
    media($("screen"), p.video, p.poster, p.img);
    media($("screen2"), p.video, p.poster, p.img);
    media($("screenMobile"), p.videoMobile, p.poster.replace("desktop", "mobile"), p.mobile);
    media($("nextMedia"), next.video, next.poster, next.img);

    $("url").textContent = $("url2").textContent = p.domain || p.name.toLowerCase().replace(/\s+/g, "") + " · anteprima";
    if (!p.video) {
        $("live").classList.add("static");
        $("liveText").textContent = "PREVIEW";
    }
    $("capLeft").textContent = p.video ? "Registrazione reale del sito, senza tagli" : "Anteprima statica · " + p.status.toLowerCase();
    $("capRight").textContent = p.status;

    const facts = [
        ["Tipo", p.type.split("·")[0].trim().toLowerCase().replace(/^./, function (c) { return c.toUpperCase(); })],
        ["Ruolo", p.role],
        ["Stato", p.status],
        ["Stack", '<span class="tags">' + p.tags.map(function (t) { return "<span>" + t + "</span>"; }).join("") + "</span>"]
    ];
    $("facts").innerHTML = facts.map(function (f) { return '<div class="fact reveal"><h3>' + f[0] + "</h3><p>" + f[1] + "</p></div>"; }).join("");
    $("about").innerHTML = p.text.map(function (t, k) { return '<p class="reveal' + (t.startsWith("«") ? " quote" : "") + '">' + t + "</p>"; }).join("");

    $("nextCount").textContent = pad((i + 1) % P.length + 1) + " / " + pad(P.length);
    $("nextName").textContent = next.name;

    /* i video partono solo quando sono visibili */
    const io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { if (e.isIntersecting) e.target.play().catch(function () {}); else e.target.pause(); });
    }, { threshold: .15 });
    document.querySelectorAll("video").forEach(function (v) { io.observe(v); });

    /* ---------- ANIMAZIONI ---------- */
    const curtain = $("curtain");
    if (reduced || !window.gsap) {
        curtain.remove();
        document.documentElement.classList.remove("js");
        return;
    }

    gsap.registerPlugin(ScrollTrigger);
    const lenis = new Lenis({ lerp: .1 });
    lenis.on("scroll", ScrollTrigger.update);
    gsap.ticker.add(function (t) { lenis.raf(t * 1000); });
    gsap.ticker.lagSmoothing(0);

    /* entrata: sipario che si alza, titolo che sale */
    const intro = gsap.timeline({ defaults: { ease: "expo.out" } });
    intro.to(curtain, { yPercent: -100, duration: 1.1, ease: "expo.inOut" })
         .from(".top", { opacity: 0, duration: .8 }, .6)
         .from("#eyebrow", { opacity: 0, y: 14, duration: .9 }, .65)
         .from(".title .w > span", { yPercent: 110, duration: 1.3, stagger: .08 }, .7)
         .to(".intro-row", { opacity: 1, y: 0, duration: 1.1 }, 1)
         .from("#browser", { y: 120, opacity: 0, duration: 1.4 }, .95);

    /* barra di avanzamento */
    gsap.to("#progress", { scaleX: 1, ease: "none", scrollTrigger: { start: 0, end: "max", scrub: true } });

    /* il video principale si allarga mentre arriva al centro */
    gsap.fromTo("#browser", { scale: .9 }, {
        scale: 1, ease: "none",
        scrollTrigger: { trigger: ".stage", start: "top 85%", end: "center 55%", scrub: true }
    });

    /* blocchi che compaiono uno dopo l'altro */
    ScrollTrigger.batch(".facts .reveal, .about .reveal, .devices .reveal", {
        start: "top 88%",
        onEnter: function (els) { gsap.to(els, { opacity: 1, y: 0, duration: 1.1, ease: "expo.out", stagger: .1 }); }
    });

    /* desktop e mobile: il telefono sale più veloce (parallasse) */
    gsap.fromTo("#phone", { y: 140, rotate: 4 }, { y: -60, rotate: 0, ease: "none", scrollTrigger: { trigger: ".devices-grid", start: "top bottom", end: "bottom top", scrub: true } });
    gsap.fromTo("#browserSmall", { y: 40 }, { y: -20, ease: "none", scrollTrigger: { trigger: ".devices-grid", start: "top bottom", end: "bottom top", scrub: true } });

    /* prossimo progetto: l'immagine si apre dal centro */
    gsap.fromTo("#nextMedia", { clipPath: "inset(18% 22% 18% 22% round 20px)" }, {
        clipPath: "inset(0% 0% 0% 0% round 20px)", ease: "none",
        scrollTrigger: { trigger: "#next", start: "top 80%", end: "bottom bottom", scrub: true }
    });

    /* uscita: il sipario scende prima di cambiare pagina */
    document.querySelectorAll("a[href]").forEach(function (a) {
        if (a.target === "_blank" || a.getAttribute("href").startsWith("#")) return;
        a.addEventListener("click", function (e) {
            e.preventDefault();
            gsap.fromTo(curtain, { yPercent: 100 }, { yPercent: 0, duration: .7, ease: "expo.in", onComplete: function () { location.href = a.href; } });
        });
    });
    addEventListener("pageshow", function (e) { if (e.persisted) gsap.set(curtain, { yPercent: -100 }); });
})();
</script>
</body>
</html>
