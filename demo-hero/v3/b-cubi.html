<script type="module">
import * as THREE from "three";

const P = window.PROJECTS;
const mobile = innerWidth < 760;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const pad = n => String(n).padStart(2, "0");
const $ = id => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(mobile ? 55 : 38, innerWidth / innerHeight, .1, 100);
camera.position.set(0, 0, 16);

/* ---------- GRIGLIA ---------- */
const COLS = mobile ? 28 : 40, ROWS = Math.round(COLS / 1.6);
const N = COLS * ROWS;
const SW = mobile ? 6.6 : 8.4, SH = SW / 1.6;
const CELL = SW / COLS;
const CENTER = new THREE.Vector3(mobile ? 0 : 2.6, mobile ? 1.1 : 0, 0);

const geo = new THREE.InstancedBufferGeometry().copy(new THREE.BoxGeometry(1, 1, 1));
geo.instanceCount = N;
const aCell = new Float32Array(N * 2), aRnd = new Float32Array(N), aCloud = new Float32Array(N * 3), aRot = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
    aCell[i * 2] = i % COLS; aCell[i * 2 + 1] = Math.floor(i / COLS);
    aRnd[i] = Math.random();
    /* nella hero i cubi formano un anello inclinato intorno al nome */
    const a = Math.random() * Math.PI * 2;
    const r = (mobile ? 3.4 : 6.2) + (Math.random() - .5) * (mobile ? 1.6 : 2.6);
    aCloud[i * 3] = Math.cos(a) * r;
    aCloud[i * 3 + 1] = Math.sin(a) * r * .56 + (Math.random() - .5) * .8;
    aCloud[i * 3 + 2] = Math.sin(a) * r * .5 + (Math.random() - .5) * 1.2;
    aRot[i * 3] = Math.random() * 6.28; aRot[i * 3 + 1] = Math.random() * 6.28; aRot[i * 3 + 2] = Math.random() * 6.28;
}
geo.setAttribute("aCell", new THREE.InstancedBufferAttribute(aCell, 2));
geo.setAttribute("aRnd", new THREE.InstancedBufferAttribute(aRnd, 1));
geo.setAttribute("aCloud", new THREE.InstancedBufferAttribute(aCloud, 3));
geo.setAttribute("aRot", new THREE.InstancedBufferAttribute(aRot, 3));

const blank = new THREE.DataTexture(new Uint8Array([20, 18, 22, 255]), 1, 1); blank.needsUpdate = true;

const mat = new THREE.ShaderMaterial({
    uniforms: {
        uAssemble: { value: 0 }, uFlip: { value: 0 }, uTime: { value: 0 },
        uTexA: { value: blank }, uTexB: { value: blank }, uAspA: { value: 1.6 }, uAspB: { value: 1.6 },
        uMouse: { value: new THREE.Vector3(99, 99, 0) }, uMouseK: { value: 0 }, uWave: { value: 0 },
        uGrid: { value: new THREE.Vector2(COLS, ROWS) }, uCell: { value: CELL },
        uCenter: { value: CENTER }, uSize: { value: new THREE.Vector2(SW, SH) }, uIntro: { value: 0 }
    },
    vertexShader: /* glsl */`
        attribute vec2 aCell; attribute float aRnd; attribute vec3 aCloud; attribute vec3 aRot;
        uniform float uAssemble, uFlip, uTime, uMouseK, uWave, uCell, uIntro;
        uniform vec2 uGrid, uSize; uniform vec3 uCenter, uMouse;
        varying vec2 vUvA; varying vec2 vUvB; varying float vFace; varying vec3 vN; varying float vA; varying float vPop; varying float vRnd;

        mat3 rx(float a){ float c = cos(a), s = sin(a); return mat3(1,0,0, 0,c,s, 0,-s,c); }
        mat3 ry(float a){ float c = cos(a), s = sin(a); return mat3(c,0,-s, 0,1,0, s,0,c); }
        mat3 rz(float a){ float c = cos(a), s = sin(a); return mat3(c,s,0, -s,c,0, 0,0,1); }
        float ease(float t){ return t < .5 ? 4.*t*t*t : 1. - pow(-2.*t + 2., 3.) / 2.; }

        void main(){
            vec2 g = aCell / uGrid;
            vec3 cellPos = uCenter + vec3((aCell + .5) / uGrid - .5, 0.) * vec3(uSize, 1.);

            // assemblaggio: ogni cubo parte con un piccolo ritardo diverso
            float delay = aRnd * .3 + (1. - g.y) * .2;
            float a = ease(clamp((uAssemble - delay) / .5, 0., 1.));
            vA = a; vRnd = aRnd;

            // nella nuvola: l'anello gira lentamente
            float ang = uTime * .12;
            vec3 cloud = aCloud;
            cloud.xz = mat2(cos(ang), -sin(ang), sin(ang), cos(ang)) * cloud.xz;
            cloud.y += sin(uTime * .8 + aRnd * 12.) * .12;
            cloud = mix(cloud * 2.5 + vec3(0., 0., -6.), cloud, uIntro);   // entrata

            // il mouse spinge via i cubi della nuvola
            vec2 dm = cloud.xy - uMouse.xy;
            float fm = smoothstep(2.4, 0., length(dm)) * uMouseK * (1. - a);
            cloud.xy += normalize(dm + 1e-4) * fm * 1.2;
            cloud.z += fm * 1.5;

            vec3 pos = mix(cloud, cellPos, a);

            // sullo schermo: i cubi sotto il mouse escono in rilievo
            float dist = length(cellPos.xy - uMouse.xy);
            float pop = smoothstep(1.5, 0., dist) * uMouseK * a;
            vPop = pop;
            pos.z += pop * 1.1 + sin(g.x * 9. + uTime * 3.) * uWave * a;

            // rotazione: casuale nella nuvola, giro di 180° (onda) al cambio progetto
            float fl = ease(clamp(uFlip * 1.7 - g.x * .55 - aRnd * .15, 0., 1.));
            vec3 r = aRot + uTime * vec3(.3, .2, .1);
            vec3 rr = r * (1. - a);
            mat3 R = rx(fl * 3.14159) * rz(rr.z) * ry(rr.y) * rx(rr.x);
            R = R * rx(-pop * .5 * sign(cellPos.y - uMouse.y)) * ry(pop * .5 * sign(cellPos.x - uMouse.x));

            vec3 size = mix(vec3(uCell * 1.35), vec3(uCell * .94, uCell * .94, uCell * 1.4), a);
            vec3 p = R * (position * size) + pos;

            vN = normalize(R * normal);
            vFace = normal.z > .5 ? 1. : (normal.z < -.5 ? -1. : 0.);
            vUvA = (aCell + uv) / uGrid;
            vUvB = (aCell + vec2(1. - uv.x, 1. - uv.y)) / uGrid;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.);
        }`,
    fragmentShader: /* glsl */`
        uniform sampler2D uTexA, uTexB; uniform float uAspA, uAspB;
        varying vec2 vUvA; varying vec2 vUvB; varying float vFace; varying vec3 vN; varying float vA; varying float vPop; varying float vRnd;
        vec2 cover(vec2 uv, float asp){ float r = 1.6 / asp; if (r > 1.) uv.y = 1. - (1. - uv.y) / r; else uv.x = (uv.x - .5) * r + .5; return uv; }
        void main(){
            vec3 col;
            if (vFace > .5) col = texture2D(uTexA, cover(vUvA, uAspA)).rgb;
            else if (vFace < -.5) col = texture2D(uTexB, cover(vUvB, uAspB)).rgb;
            else col = vec3(.11, .1, .13);
            // nella nuvola i frammenti sono più scuri, con riflessi rosa
            // nella nuvola: cubi rosa, lavanda e bianchi
            vec3 cloudCol = vRnd < .45 ? vec3(1., .18, .43) : (vRnd < .75 ? vec3(.62, .55, .95) : vec3(.94, .93, .96));
            col = mix(cloudCol, col, vA);
            vec3 L = normalize(vec3(.4, .6, 1.));
            float diff = max(dot(vN, L), 0.);
            float side = 1. - abs(vFace);
            col *= mix(.55, 1., diff);
            col += side * vec3(1., .18, .43) * (.06 + vPop * .5) * (1. - diff * .5);
            col += pow(max(dot(reflect(-L, vN), vec3(0., 0., 1.)), 0.), 24.) * .25;
            gl_FragColor = vec4(col, 1.);
        }`
});
const cubes = new THREE.Mesh(geo, mat);
cubes.frustumCulled = false;
scene.add(cubes);

/* ---------- TEXTURE: video veri ---------- */
const loader = new THREE.TextureLoader();
const media = P.map(p => {
    const m = { poster: loader.load(p.poster), video: null, tex: null, asp: 1.6 };
    m.poster.colorSpace = THREE.NoColorSpace;
    m.poster.minFilter = THREE.LinearFilter;
    return m;
});
function texFor(k) {
    const m = media[k], p = P[k];
    if (p.video && !m.video) {
        const v = document.createElement("video");
        v.src = p.video; v.muted = true; v.loop = true; v.playsInline = true; v.preload = "auto";
        m.video = v;
        m.tex = new THREE.VideoTexture(v);
        m.tex.colorSpace = THREE.NoColorSpace;
    }
    if (m.video) { m.video.play().catch(() => {}); if (m.video.readyState >= 2) return m.tex; }
    return m.poster;
}
function aspectFor(k) {
    const m = media[k];
    if (m.video && m.video.videoWidth) return m.video.videoWidth / m.video.videoHeight;
    if (m.poster.image) return m.poster.image.width / m.poster.image.height;
    return 1.6;
}

/* ---------- SCROLL ---------- */
const SECTIONS = 2 + P.length + 1;          // hero, assemblaggio, progetti, contatti
$("scroller").style.height = (SECTIONS * 100) + "vh";
const lenis = new Lenis({ lerp: .085 });
let scrollP = 0, lastP = 0, vel = 0;
lenis.on("scroll", l => { scrollP = l.limit ? Math.min(1, Math.max(0, l.scroll / l.limit)) : 0; });
(function raf(t) { lenis.raf(t); requestAnimationFrame(raf); })(0);

function goTo(i) {
    const max = document.documentElement.scrollHeight - innerHeight;
    lenis.scrollTo(i === "end" ? max : (i / (SECTIONS - 1)) * max, { duration: 2 });
}
document.querySelectorAll("[data-goto]").forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    const g = a.dataset.goto;
    goTo(g === "end" ? "end" : g === "proj" ? 2 : 0);
}));

/* ---------- PANNELLO ---------- */
$("pTot").textContent = pad(P.length);
$("bar").innerHTML = P.map(() => "<i></i>").join("");
let current = -1, shown = -1;
let flipping = false, flipStart = 0, flipTo = -1;
const FLIP_MS = reduced ? 1 : 1300;

function updatePanel(k) {
    const swap = $("swap");
    swap.classList.add("out");
    setTimeout(() => {
        $("pNum").textContent = pad(k + 1);
        $("pName").textContent = P[k].name;
        $("pShort").textContent = P[k].short + ".";
        $("pStatus").textContent = P[k].status;
        swap.classList.remove("out");
    }, 260);
    $("bar").querySelectorAll("i").forEach((b, j) => b.classList.toggle("on", j <= k));
}

function showProject(k) {
    if (k === shown && !flipping) return;
    if (shown < 0) {
        /* primo progetto: appare direttamente mentre i cubi si assemblano */
        shown = k;
        mat.uniforms.uTexA.value = texFor(k);
        mat.uniforms.uAspA.value = aspectFor(k);
        updatePanel(k);
        return;
    }
    if (flipping) {
        /* se si scorre veloce chiudiamo subito il giro precedente */
        mat.uniforms.uTexA.value = mat.uniforms.uTexB.value;
        mat.uniforms.uAspA.value = mat.uniforms.uAspB.value;
        mat.uniforms.uFlip.value = 0;
        shown = flipTo;
        if (k === shown) { flipping = false; return; }
    }
    flipTo = k;
    mat.uniforms.uTexB.value = texFor(k);
    mat.uniforms.uAspB.value = aspectFor(k);
    flipStart = performance.now();
    flipping = true;
    updatePanel(k);
}

function openProject(k) {
    const c = $("curtain");
    c.style.transition = "transform .7s cubic-bezier(.7,0,.2,1)";
    c.style.transform = "translateY(0)";
    setTimeout(() => { location.href = "progetto.html?p=" + P[k].id + "&from=b-cubi.html"; }, 720);
}
$("pOpen").addEventListener("click", e => { e.preventDefault(); if (current >= 0) openProject(current); });

/* ---------- MOUSE ---------- */
const ndc = new THREE.Vector2(9, 9);
const ray = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const hitP = new THREE.Vector3();
let mouseK = 0, overScreen = false, lastMove = 0;
addEventListener("pointermove", e => {
    ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    lastMove = performance.now();
    const l = $("hoverLabel"); l.style.left = e.clientX + "px"; l.style.top = e.clientY + "px";
});
renderer.domElement.addEventListener("click", () => { if (overScreen && current >= 0) openProject(current); });

/* ---------- INTRO ---------- */
const curtain = $("curtain");
curtain.style.transform = "translateY(0)";
requestAnimationFrame(() => { curtain.style.transition = "transform 1.1s cubic-bezier(.7,0,.2,1)"; curtain.style.transform = "translateY(-100%)"; });
document.querySelectorAll(".hero h1 .w > span").forEach((s, i) => s.animate([{ transform: "translateY(110%)" }, { transform: "none" }],
    { duration: 1300, delay: 650 + i * 110, easing: "cubic-bezier(.16,1,.3,1)", fill: "forwards" }));
document.querySelectorAll(".hero .kicker, .hero .role, .hero .what, .cue").forEach((el, i) => el.animate([{ opacity: 0, transform: "translateY(16px)" }, { opacity: 1, transform: "none" }],
    { duration: 1000, delay: 1000 + i * 90, easing: "cubic-bezier(.16,1,.3,1)", fill: "backwards" }));
addEventListener("pageshow", e => { if (e.persisted) { curtain.style.transition = "none"; curtain.style.transform = "translateY(-100%)"; } });

/* ---------- LOOP ---------- */
const clock = new THREE.Clock();
let intro = 0, camX = 0, camY = 0;
function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), .05);
    const U = mat.uniforms;
    U.uTime.value = reduced ? 0 : clock.elapsedTime;
    intro = Math.min(1, intro + dt / 2.6);
    U.uIntro.value = 1 - Math.pow(1 - intro, 4);

    const idx = scrollP * (SECTIONS - 1);
    vel += ((scrollP - lastP) * 60 - vel) * .12; lastP = scrollP;

    /* 0→1: dalla nuvola allo schermo */
    const assemble = THREE.MathUtils.clamp((idx - .2) / 1.4, 0, 1);
    U.uAssemble.value = assemble;
    U.uWave.value = THREE.MathUtils.clamp(vel * 4, -.5, .5);

    /* progetto corrente */
    const k = THREE.MathUtils.clamp(Math.floor(idx - 1.5), 0, P.length - 1);
    current = assemble > .6 && idx < SECTIONS - 1.4 ? k : -1;
    if (current >= 0) showProject(current);

    /* giro dei cubi */
    if (flipping) {
        const f = Math.min(1, (now - flipStart) / FLIP_MS);
        U.uFlip.value = f;
        if (f >= 1) {
            U.uTexA.value = U.uTexB.value; U.uAspA.value = U.uAspB.value;
            U.uFlip.value = 0; flipping = false; shown = flipTo;
        }
    }
    /* il video potrebbe essere pronto solo dopo: aggiorniamo la texture */
    if (!flipping && shown >= 0) {
        const t = texFor(shown);
        if (U.uTexA.value !== t) U.uTexA.value = t;
        U.uAspA.value = aspectFor(shown);
    }
    media.forEach((m, j) => { if (m.video && j !== shown && j !== flipTo && !m.video.paused) m.video.pause(); });

    /* mouse sul piano dello schermo */
    ray.setFromCamera(ndc, camera);
    ray.ray.intersectPlane(plane, hitP);
    if (hitP) U.uMouse.value.lerp(hitP, .2);
    const moving = now - lastMove < 1500 && ndc.x < 5;
    mouseK += ((moving ? 1 : 0) - mouseK) * .06;
    U.uMouseK.value = mouseK;
    overScreen = assemble > .95 && hitP && Math.abs(hitP.x - CENTER.x) < SW / 2 && Math.abs(hitP.y - CENTER.y) < SH / 2;
    renderer.domElement.classList.toggle("pointer", !!overScreen);
    $("hoverLabel").classList.toggle("on", !!overScreen);

    /* camera: si avvicina mentre lo schermo si forma e segue il mouse */
    const tx = (ndc.x < 5 ? ndc.x : 0), ty = (ndc.y < 5 ? ndc.y : 0);
    camX += (tx * (1.4 - assemble * .9) - camX) * .05;
    camY += (ty * (.9 - assemble * .5) - camY) * .05;
    camera.position.set(camX + CENTER.x * assemble * .5, camY + (1 - assemble) * .6, 16 - assemble * (mobile ? 1.5 : 2.2));
    camera.lookAt(CENTER.x * assemble, CENTER.y * assemble, 0);

    /* testi */
    const heroOut = Math.min(1, idx * 2.2);
    $("hero").style.opacity = 1 - heroOut;
    $("hero").style.transform = "scale(" + (1 - heroOut * .08) + ")";
    $("cue").style.opacity = 1 - Math.min(1, idx * 5);
    $("panel").classList.toggle("on", current >= 0);
    $("outro").classList.toggle("on", idx > SECTIONS - 1.4);

    renderer.render(scene, camera);
}
requestAnimationFrame(frame);

addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
