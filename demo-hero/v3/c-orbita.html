<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const P = window.PROJECTS;
const mobile = innerWidth < 760;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const pad = n => String(n).padStart(2, "0");
const $ = id => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.setClearColor(0x0d0c0f);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(mobile ? 60 : 40, innerWidth / innerHeight, .1, 100);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;

/* ---------- SFONDO: bagliore + nome (rifratti dal vetro) ---------- */
function nameTexture() {
    const c = document.createElement("canvas");
    c.width = 2048; c.height = 1024;
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
    const s = mobile ? 250 : 215;
    g.font = "760 " + s + "px 'Bricolage Grotesque'";
    g.fillText("AGNESE", 1024, 470 - s * .46);
    g.fillText("BARNABA", 1024, 470 + s * .46);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.NoColorSpace;
    return t;
}
const bgMat = new THREE.ShaderMaterial({
    uniforms: { uText: { value: null }, uTextK: { value: 1 }, uTime: { value: 0 }, uAspect: { value: 2 } },
    vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }",
    fragmentShader: /* glsl */`
        uniform sampler2D uText; uniform float uTextK, uTime, uAspect; varying vec2 vUv;
        void main(){
            vec2 p = (vUv - .5) * vec2(uAspect, 1.);
            float glow = exp(-dot(p - vec2(sin(uTime*.2)*.2, -.05), p - vec2(sin(uTime*.2)*.2, -.05)) * 7.);
            vec3 col = vec3(.051, .047, .059) + vec3(1., .18, .43) * glow * .3 + vec3(.35, .3, 1.) * exp(-dot(p - vec2(.7, .4), p - vec2(.7, .4)) * 9.) * .14;
            float t = texture2D(uText, vUv).r * uTextK;
            col = mix(col, vec3(.95, .94, .96), t);
            gl_FragColor = vec4(col, 1.);
        }`
});
const bg = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), bgMat);
bg.position.z = -9;
scene.add(bg);
function layoutBg() {
    const h = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 22;
    bg.scale.set(h * camera.aspect * 1.3, h * 1.3, 1);
    bgMat.uniforms.uAspect.value = camera.aspect;
}

/* ---------- ANELLO DI SCHERMI ---------- */
const R = mobile ? 4.2 : 6.2;
const W = mobile ? 3.4 : 5.2, H = W / 1.6;
const loader = new THREE.TextureLoader();
const ring = new THREE.Group();
ring.position.z = -1.2;
scene.add(ring);

const screenMat = (tex) => new THREE.ShaderMaterial({
    uniforms: { uTex: { value: tex }, uFocus: { value: 0 }, uHover: { value: 0 }, uVis: { value: 0 }, uR: { value: R }, uAspect: { value: W / H }, uTexAspect: { value: 1.6 } },
    vertexShader: /* glsl */`
        uniform float uR, uHover; varying vec2 vUv;
        void main(){
            vUv = uv;
            vec3 p = position;
            p.z += uR - sqrt(uR * uR - p.x * p.x);        // curvato come l'anello
            p.z += uHover * .15 * sin(uv.x * 3.14159);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.);
        }`,
    fragmentShader: /* glsl */`
        uniform sampler2D uTex; uniform float uFocus, uHover, uVis, uAspect, uTexAspect; varying vec2 vUv;
        float rbox(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
        void main(){
            vec2 p = (vUv - .5) * vec2(uAspect, 1.);
            float d = rbox(p, vec2(uAspect * .5, .5), .04);
            if (d > 0. || uVis < .01) discard;
            vec2 uv = vUv;
            float r = uAspect / uTexAspect;
            if (r > 1.) uv.y = 1. - (1. - uv.y) / r; else uv.x = (uv.x - .5) * r + .5;
            vec3 col = texture2D(uTex, uv).rgb;
            float g = dot(col, vec3(.299, .587, .114));
            col = mix(vec3(g) * .25, col, .2 + .8 * uFocus);
            col = mix(col, vec3(1., .18, .43), smoothstep(-.012, 0., d) * (.2 + uHover * .8));
            col = mix(vec3(.051, .047, .059), col, uVis);
            gl_FragColor = vec4(col, 1.);
        }`
});

const panels = P.map((p, k) => {
    const tex = loader.load(p.poster);
    tex.colorSpace = THREE.NoColorSpace;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(W, H, 40, 6), screenMat(tex));
    m.userData = { k, hover: 0, video: null, vtex: null };
    ring.add(m);
    return m;
});

function ensureVideo(m) {
    const p = P[m.userData.k];
    if (!p.video || m.userData.video) return;
    const v = document.createElement("video");
    v.src = p.video; v.muted = true; v.loop = true; v.playsInline = true; v.preload = "auto";
    const t = new THREE.VideoTexture(v); t.colorSpace = THREE.NoColorSpace;
    m.userData.video = v; m.userData.vtex = t;
    v.addEventListener("playing", () => { m.material.uniforms.uTex.value = t; }, { once: true });
}

/* ---------- GOCCIA DI VETRO ---------- */
const NOISE = /* glsl */`
vec3 mod289(vec3 x){return x - floor(x*(1./289.))*289.;}
vec4 mod289(vec4 x){return x - floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - .85373472095314*r;}
float snoise(vec3 v){
    const vec2 C = vec2(1./6., 1./3.); const vec4 D = vec4(0., .5, 1., 2.);
    vec3 i = floor(v + dot(v, C.yyy)); vec3 x0 = v - i + dot(i, C.xxx);
    vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1. - g;
    vec3 i1 = min(g.xyz, l.zxy); vec3 i2 = max(g.xyz, l.zxy);
    vec3 x1 = x0 - i1 + C.xxx; vec3 x2 = x0 - i2 + C.yyy; vec3 x3 = x0 - D.yyy;
    i = mod289(i);
    vec4 p = permute(permute(permute(i.z + vec4(0., i1.z, i2.z, 1.)) + i.y + vec4(0., i1.y, i2.y, 1.)) + i.x + vec4(0., i1.x, i2.x, 1.));
    float n_ = .142857142857; vec3 ns = n_ * D.wyz - D.xzx;
    vec4 j = p - 49. * floor(p * ns.z * ns.z);
    vec4 x_ = floor(j * ns.z); vec4 y_ = floor(j - 7. * x_);
    vec4 x = x_ * ns.x + ns.yyyy; vec4 y = y_ * ns.x + ns.yyyy; vec4 h = 1. - abs(x) - abs(y);
    vec4 b0 = vec4(x.xy, y.xy); vec4 b1 = vec4(x.zw, y.zw);
    vec4 s0 = floor(b0)*2.+1.; vec4 s1 = floor(b1)*2.+1.; vec4 sh = -step(h, vec4(0.));
    vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy; vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
    vec3 p0 = vec3(a0.xy,h.x); vec3 p1 = vec3(a0.zw,h.y); vec3 p2 = vec3(a1.xy,h.z); vec3 p3 = vec3(a1.zw,h.w);
    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
    vec4 m = max(.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.); m = m*m;
    return 42. * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
uniform float uTime; uniform float uAmp; uniform vec3 uPull; uniform float uPullK;
vec3 displace(vec3 p){
    vec3 n = normalize(p);
    float d = snoise(n * 1.05 + uTime * .3) * uAmp + snoise(n * 2.1 - uTime * .2) * uAmp * .22;
    d += uPullK * smoothstep(1.1, 0., distance(n, uPull)) * .35;      // si allunga verso il mouse
    return n * (length(p) + d);
}`;
const blobU = { uTime: { value: 0 }, uAmp: { value: .17 }, uPull: { value: new THREE.Vector3(0, 0, 1) }, uPullK: { value: 0 } };
const glass = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, roughness: .03, transmission: 1, thickness: 1.1, ior: 1.42, dispersion: 5,
    iridescence: 1, iridescenceIOR: 1.35, iridescenceThicknessRange: [180, 800], clearcoat: 1, envMapIntensity: 1.1
});
glass.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, blobU);
    sh.vertexShader = sh.vertexShader
        .replace("#include <common>", "#include <common>\n" + NOISE + "\n")
        .replace("#include <beginnormal_vertex>", `
            vec3 tA = abs(normal.y) < .99 ? normalize(cross(normal, vec3(0.,1.,0.))) : normalize(cross(normal, vec3(1.,0.,0.)));
            vec3 tB = normalize(cross(normal, tA));
            vec3 dp0 = displace(position), dp1 = displace(position + tA * .01), dp2 = displace(position + tB * .01);
            vec3 objectNormal = normalize(cross(dp1 - dp0, dp2 - dp0));
            if (dot(objectNormal, normal) < 0.) objectNormal = -objectNormal;`)
        .replace("#include <begin_vertex>", "vec3 transformed = dp0;");
};
const blob = new THREE.Mesh(new THREE.IcosahedronGeometry(1, mobile ? 40 : 64), glass);
scene.add(blob);

/* ---------- SCROLL ---------- */
const SECTIONS = 2 + P.length + 1;
$("scroller").style.height = (SECTIONS * 100) + "vh";
const lenis = new Lenis({ lerp: .085 });
let scrollP = 0;
lenis.on("scroll", l => { scrollP = l.limit ? Math.min(1, Math.max(0, l.scroll / l.limit)) : 0; });
(function raf(t) { lenis.raf(t); requestAnimationFrame(raf); })(0);
function goTo(i) {
    const max = document.documentElement.scrollHeight - innerHeight;
    lenis.scrollTo(i === "end" ? max : (i / (SECTIONS - 1)) * max, { duration: 2 });
}
document.querySelectorAll("[data-goto]").forEach(a => a.addEventListener("click", e => {
    e.preventDefault(); const g = a.dataset.goto; goTo(g === "end" ? "end" : g === "proj" ? 2 : 0);
}));
P.forEach((p, k) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = pad(k + 1); b.title = p.name;
    b.addEventListener("click", () => goTo(k + 2)); $("dots").appendChild(b);
});

const dwell = u => u - Math.sin(u * Math.PI * 2) / (Math.PI * 2) * .9;

let active = -1;
function setActive(k) {
    if (k === active) return;
    active = k;
    $("dots").querySelectorAll("button").forEach((b, j) => b.classList.toggle("on", j === k));
    if (k < 0) { $("panel").classList.remove("on"); return; }
    $("swap").classList.add("out");
    setTimeout(() => {
        $("pNum").textContent = pad(k + 1) + " / " + pad(P.length) + " — " + P[k].status;
        $("pName").textContent = P[k].name;
        $("pShort").textContent = P[k].short + ".";
        $("swap").classList.remove("out");
    }, 220);
    $("panel").classList.add("on");
}
function openProject(k) {
    const c = $("curtain");
    c.style.transition = "transform .7s cubic-bezier(.7,0,.2,1)"; c.style.transform = "translateY(0)";
    setTimeout(() => { location.href = "progetto.html?p=" + P[k].id + "&from=c-orbita.html"; }, 720);
}
$("pOpen").addEventListener("click", e => { e.preventDefault(); if (active >= 0) openProject(active); });

/* ---------- MOUSE ---------- */
const ndc = new THREE.Vector2(0, 0), ndcS = new THREE.Vector2();
const ray = new THREE.Raycaster();
let hovered = null, lastMove = 0;
addEventListener("pointermove", e => {
    ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    lastMove = performance.now();
    const l = $("hoverLabel"); l.style.left = e.clientX + "px"; l.style.top = e.clientY + "px";
});
renderer.domElement.addEventListener("click", () => { if (hovered) openProject(hovered.userData.k); });

/* ---------- INTRO ---------- */
const curtain = $("curtain");
curtain.style.transform = "translateY(0)";
requestAnimationFrame(() => { curtain.style.transition = "transform 1.1s cubic-bezier(.7,0,.2,1)"; curtain.style.transform = "translateY(-100%)"; });
document.querySelectorAll(".hero .role, .hero .what, .hero .cue").forEach((el, i) => el.animate([{ opacity: 0, transform: "translateY(16px)" }, { opacity: 1, transform: "none" }],
    { duration: 1000, delay: 900 + i * 100, easing: "cubic-bezier(.16,1,.3,1)", fill: "backwards" }));
addEventListener("pageshow", e => { if (e.persisted) { curtain.style.transition = "none"; curtain.style.transform = "translateY(-100%)"; } });

document.fonts.load("760 100px 'Bricolage Grotesque'").then(() => { bgMat.uniforms.uText.value = nameTexture(); });
const empty = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1); empty.needsUpdate = true;
bgMat.uniforms.uText.value = empty;
layoutBg();

/* ---------- LOOP ---------- */
const clock = new THREE.Clock();
let intro = 0;
const blobPos = new THREE.Vector3();
function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
    intro = Math.min(1, intro + dt / 2.4);
    const ei = 1 - Math.pow(1 - intro, 3);
    blobU.uTime.value = reduced ? 0 : t;
    bgMat.uniforms.uTime.value = t;
    ndcS.lerp(ndc, .06);

    const idx = scrollP * (SECTIONS - 1);
    const stage = THREE.MathUtils.smoothstep(idx, .1, 1.6);          // 0 = hero, 1 = anello

    /* camera: vicina alla goccia nella hero, poi si allontana per mostrare l'anello */
    camera.position.set(ndcS.x * (.8 - stage * .4), ndcS.y * .5 + stage * (mobile ? .4 : .9), (mobile ? 9 : 7.5) + stage * (mobile ? 4 : 5) + (1 - ei) * 6);
    camera.lookAt(0, stage * .15, -1.2 * stage);

    /* testo del nome dietro la goccia: sparisce quando arriva l'anello */
    bgMat.uniforms.uTextK.value = (1 - stage) * ei;

    /* goccia: segue il mouse e si allunga verso di lui */
    const mouseMoving = performance.now() - lastMove < 1500;
    blobPos.set(ndcS.x * (1.2 - stage * .8), ndcS.y * (.7 - stage * .5), 0);
    blob.position.lerp(blobPos, .08);
    const s = (mobile ? 1.5 : 2.05) - stage * (mobile ? .55 : .75);
    blob.scale.setScalar(s * (.6 + .4 * ei));
    blob.rotation.y += dt * .15;
    blobU.uPull.value.set(ndcS.x, ndcS.y, .6).normalize();
    blobU.uPullK.value += ((mouseMoving ? 1 : 0) - blobU.uPullK.value) * .04;

    /* anello: ruota per portare il progetto attivo dietro la goccia */
    const pIdx = THREE.MathUtils.clamp(idx - 2, 0, P.length - 1);
    const seg = Math.floor(pIdx), u = pIdx - seg;
    const ringPos = seg + (seg < P.length - 1 ? dwell(u) : 0);
    const step = Math.PI * 2 / P.length;
    ring.rotation.y = 0;
    ring.position.y = (1 - stage) * -6;

    setActive(stage > .9 && idx < SECTIONS - 1.4 ? Math.round(ringPos) : -1);

    ray.setFromCamera(ndc, camera);
    const hits = ray.intersectObjects(panels).filter(h => h.object.material.uniforms.uVis.value > .5);
    hovered = hits.length ? hits[0].object : null;
    renderer.domElement.classList.toggle("pointer", !!hovered);
    $("hoverLabel").classList.toggle("on", !!hovered);

    panels.forEach((m, k) => {
        const a = (k - ringPos) * step;                       // 0 = dietro la goccia, di fronte alla camera
        m.position.set(Math.sin(a) * R, Math.sin(t * .5 + k) * .08, -Math.cos(a) * R);
        m.lookAt(0, m.position.y, 0);
        const front = Math.cos(a);                            // 1 = dietro, -1 = davanti alla camera
        const vis = THREE.MathUtils.smoothstep(front, -.15, .45) * stage;
        const U = m.material.uniforms;
        U.uVis.value = vis;
        const focus = Math.max(0, 1 - Math.abs(k - ringPos) * 1.5) * stage;
        U.uFocus.value += (focus - U.uFocus.value) * .1;
        m.userData.hover += ((m === hovered ? 1 : 0) - m.userData.hover) * .12;
        U.uHover.value = m.userData.hover;
        m.visible = vis > .01;
        if (focus > .3) {
            ensureVideo(m);
            const v = m.userData.video;
            if (v && v.paused) v.play().catch(() => {});
            if (v && v.videoWidth) U.uTexAspect.value = v.videoWidth / v.videoHeight;
        } else if (m.userData.video && !m.userData.video.paused && focus < .05) m.userData.video.pause();
    });

    /* testi */
    $("hero").style.opacity = 1 - Math.min(1, idx * 2.2);
    $("dots").classList.toggle("on", stage > .9 && idx < SECTIONS - 1.4);
    $("outro").classList.toggle("on", idx > SECTIONS - 1.4);
    blob.visible = true;

    renderer.render(scene, camera);
}
frame();

addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    layoutBg();
});
</script>
</body>
</html>
