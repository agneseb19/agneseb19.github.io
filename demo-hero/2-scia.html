<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo 02 — Scia di progetti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo.css">
<style>
    .hero {
        position: relative;
        height: 100vh;
        height: 100svh;
        overflow: hidden;
        cursor: crosshair;
        touch-action: manipulation;
    }

    .hero-text {
        position: absolute;
        inset: 0;
        z-index: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 0 16px;
        pointer-events: none;
    }

    .eyebrow {
        font: 500 12px/1 var(--mono);
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 26px;
    }

    .eyebrow i {
        display: inline-block; width: 7px; height: 7px; border-radius: 50%;
        background: #2bb673; margin-right: 8px; vertical-align: 1px;
    }

    h1 {
        margin: 0;
        font-size: clamp(56px, 13vw, 210px);
        line-height: .86;
        letter-spacing: -.055em;
        font-weight: 800;
        font-variation-settings: "opsz" 96;
    }

    h1 span { display: block; }
    h1 .pink { color: var(--pink); font-weight: 300; font-style: normal; }

    .hero-foot {
        position: absolute;
        left: 0; right: 0; bottom: 64px;
        z-index: 2;
        display: flex;
        justify-content: center;
        pointer-events: none;
    }

    .hero-foot .btn { pointer-events: auto; }
</style>
</head>
<body>

<div class="demo-bar">
    <a class="demo-back" href="index.html">← Tutte le demo</a>
    <span class="demo-tag"><b>02</b> · Scia di progetti</span>
</div>

<section class="hero" id="hero">
    <div class="hero-text">
        <span class="eyebrow"><i></i>Web designer · Front-end developer</span>
        <h1><span>Agnese</span><span class="pink">Barnaba</span></h1>
    </div>
    <div class="hero-foot">
        <a class="btn" href="#">Scopri i progetti <span>→</span></a>
    </div>
</section>

<p class="demo-hint">Muovi il mouse · su telefono tocca lo schermo</p>

<script src="shared.js"></script>
<script>
    initTrail(document.getElementById("hero"), { autoplay: true });
</script>
</body>
</html>
