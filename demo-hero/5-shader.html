<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo 05 — Sfondo shader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo.css">
<style>
    body { transition: color .5s; }
    body.dark { color: var(--paper); }

    canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
    }

    .hero {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 100px 6vw 90px;
    }

    .eyebrow {
        font: 500 12px/1 var(--mono);
        letter-spacing: .08em;
        text-transform: uppercase;
        margin-bottom: 28px;
        opacity: .7;
    }

    h1 {
        margin: 0 0 30px;
        font-size: clamp(54px, 11.5vw, 196px);
        line-height: .86;
        letter-spacing: -.055em;
        font-weight: 780;
        max-width: 12ch;
    }

    h1 em { font-style: normal; font-weight: 250; }

    .row { display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
    .row p { margin: 0; max-width: 420px; font-size: 18px; line-height: 1.5; opacity: .75; }

    body.dark .btn { background: var(--paper); color: var(--ink); }
    body.dark .btn:hover { background: var(--pink); color: #fff; }

    .toggle {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 101;
        padding: 10px 16px;
        font-size: 13px;
        background: rgba(248,247,245,.85);
        color: var(--ink);
    }

    .fallback { background: radial-gradient(circle at 70% 30%, #f3b6cb, transparent 50%), var(--lavender); }
</style>
</head>
<body>

<div class="demo-bar">
    <a class="demo-back" href="index.html">← Tutte le demo</a>
    <span class="demo-tag"><b>05</b> · Sfondo shader</span>
</div>

<canvas id="gl" aria-hidden="true"></canvas>

<section class="hero">
    <span class="eyebrow">Agnese Barnaba — Web designer · Front-end developer</span>
    <h1>Designing <em>digital</em> experiences.</h1>
    <div class="row">
        <a class="btn" href="#">Scopri i progetti →</a>
        <p>Trasformo idee e progetti grafici in siti web funzionali, interattivi e curati nei dettagli.</p>
    </div>
</section>

<button class="btn toggle" id="toggle" type="button">◐ Versione scura</button>
<p class="demo-hint">Muovi il mouse: il colore lo segue</p>

<script src="shared.js"></script>
<script>
(function () {
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl", { antialias: false, alpha: false });
    const toggle = document.getElementById("toggle");

    if (!gl) { document.body.classList.add("fallback"); return; }

    const vert = "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";

    const frag = `
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform vec2 uMouse;
uniform float uDark;
uniform float uEnergy;

float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float noise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(h(i), h(i + vec2(1.0, 0.0)), u.x),
               mix(h(i + vec2(0.0, 1.0)), h(i + vec2(1.0, 1.0)), u.x), u.y);
}

float fbm(vec2 p){
    float v = 0.0, a = 0.5;
    for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; }
    return v;
}

void main(){
    vec2 uv = gl_FragCoord.xy / uRes;
    float asp = uRes.x / uRes.y;
    vec2 p = vec2(uv.x * asp, uv.y);
    vec2 m = vec2(uMouse.x * asp, uMouse.y);

    // il mouse "risucchia" e fa girare il colore intorno a sé
    vec2 dm = p - m;
    float d = length(dm);
    float pull = exp(-d * d * 5.0);
    float ang = pull * (1.2 + uEnergy * 2.0);
    p = m + mat2(cos(ang), -sin(ang), sin(ang), cos(ang)) * dm * (1.0 - pull * 0.25);

    float t = uTime * 0.05;
    vec2 q = vec2(fbm(p * 1.4 + t), fbm(p * 1.4 + vec2(5.2, 1.3) - t));
    vec2 r = vec2(fbm(p * 1.4 + 3.5 * q + vec2(1.7, 9.2) + t * 1.4),
                  fbm(p * 1.4 + 3.5 * q + vec2(8.3, 2.8) - t));
    float f = fbm(p * 1.4 + 3.5 * r);

    vec3 paper = mix(vec3(0.973, 0.969, 0.961), vec3(0.075, 0.067, 0.086), uDark);
    vec3 lav   = mix(vec3(0.910, 0.890, 0.945), vec3(0.165, 0.125, 0.200), uDark);
    vec3 pink  = vec3(0.859, 0.027, 0.314);
    vec3 peach = mix(vec3(1.0, 0.78, 0.82), vec3(0.42, 0.08, 0.25), uDark);

    vec3 col = mix(paper, lav, smoothstep(0.25, 0.7, f));
    col = mix(col, peach, smoothstep(0.45, 0.85, length(q) * f * 1.3) * 0.9);
    float hot = smoothstep(0.55, 0.95, f * length(r) * 1.25 + pull * 0.35);
    col = mix(col, pink, hot * mix(0.75, 0.9, uDark));

    // grana leggera, tipo carta
    col += (h(gl_FragCoord.xy + fract(uTime) * 100.0) - 0.5) * 0.035;

    gl_FragColor = vec4(col, 1.0);
}`;

    function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
        return s;
    }

    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, "p");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const U = {};
    ["uRes", "uTime", "uMouse", "uDark", "uEnergy"].forEach(function (n) { U[n] = gl.getUniformLocation(prog, n); });

    /* Risoluzione ridotta: lo sfondo è sfumato, non serve il retina */
    function resize() {
        const scale = Math.min(1, 1400 / innerWidth) * .75;
        canvas.width = Math.round(innerWidth * scale);
        canvas.height = Math.round(innerHeight * scale);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform2f(U.uRes, canvas.width, canvas.height);
    }
    addEventListener("resize", resize);
    resize();

    let tx = .7, ty = .6, mx = .7, my = .6, energy = 0, dark = 0, darkTarget = 0, lastX = 0, lastY = 0;

    addEventListener("pointermove", function (e) {
        tx = e.clientX / innerWidth;
        ty = 1 - e.clientY / innerHeight;
        const v = Math.hypot(e.clientX - lastX, e.clientY - lastY);
        energy = Math.min(1, energy + v / 600);
        lastX = e.clientX; lastY = e.clientY;
    });

    toggle.addEventListener("click", function () {
        darkTarget = darkTarget ? 0 : 1;
        document.body.classList.toggle("dark", !!darkTarget);
        toggle.textContent = darkTarget ? "◑ Versione chiara" : "◐ Versione scura";
    });

    const start = performance.now();
    function frame(now) {
        mx += (tx - mx) * .05;
        my += (ty - my) * .05;
        energy *= .96;
        dark += (darkTarget - dark) * .06;
        gl.uniform1f(U.uTime, REDUCED_MOTION ? 10 : (now - start) / 1000);
        gl.uniform2f(U.uMouse, mx, my);
        gl.uniform1f(U.uEnergy, energy);
        gl.uniform1f(U.uDark, dark);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
})();
</script>
</body>
</html>
